    <!--
      Apply the stored theme before first paint so a dark-theme visitor never
      sees a flash of the light paper background. useTheme owns it after mount.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('raila-theme');
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document.documentElement.style.backgroundColor = dark ? '#131211' : '#f7f6f3';
        } catch (e) {
          /* storage unavailable — the stylesheet default (light) applies */
        }
      })();
    </script>
